
services:
  backend:
    build: ./backend
    container_name: backend-app-test-task
    env_file:
      - backend/.env
    ports:
      - "80:80"
    depends_on:
      - database
    networks:
      - app-network

  database:
    image: postgres:15
    container_name: database-test-task
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1111
      POSTGRES_DB: test-task 
    ports:
      - "5437:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  database-data:

networks:
  app-network:
    driver: bridge